<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <pattern id="g4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(10,10,10,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#efebe3"/>
  <rect width="1200" height="675" fill="url(#g4)"/>

  <text x="60" y="70" font-family="monospace" font-size="15" letter-spacing="4" fill="#7a8b2d">RESPONSIVE E-COMMERCE · STOREFRONT</text>
  <rect x="60" y="92" width="80" height="4" fill="#0a0a0a"/>

  <!-- browser window -->
  <rect x="60" y="130" width="1080" height="470" rx="18" fill="#e7e2d5" stroke="rgba(10,10,10,0.2)"/>
  <rect x="60" y="130" width="1080" height="52" rx="18" fill="#111110"/>
  <rect x="60" y="156" width="1080" height="26" fill="#111110"/>
  <circle cx="96" cy="156" r="6" fill="#e05a4e"/>
  <circle cx="120" cy="156" r="6" fill="#a9bc4a"/>
  <circle cx="144" cy="156" r="6" fill="#efebe3" opacity="0.4"/>
  <rect x="190" y="144" width="420" height="26" rx="13" fill="rgba(239,235,227,0.12)"/>
  <text x="210" y="162" font-family="monospace" font-size="12" fill="rgba(239,235,227,0.6">furni.store — living room collection</text>

  <!-- site nav -->
  <text x="100" y="222" font-family="monospace" font-size="18" font-weight="bold" fill="#0a0a0a">FURNI.</text>
  <g font-family="monospace" font-size="13" fill="#5c5749">
    <text x="880" y="222">LIVING</text><text x="955" y="222">BEDROOM</text><text x="1045" y="222">CART (2)</text>
  </g>
  <line x1="80" y1="240" x2="1120" y2="240" stroke="rgba(10,10,10,0.15)"/>

  <!-- hero product -->
  <rect x="100" y="265" width="500" height="230" rx="16" fill="#111110"/>
  <!-- chair -->
  <g stroke="#efebe3" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M270 350 v70 h90 v-70"/>
    <path d="M255 350 h120 M270 350 q0 -30 45 -30 q45 0 45 30"/>
    <path d="M275 420 v35 M355 420 v35"/>
  </g>
  <circle cx="530" cy="300" r="26" fill="#a9bc4a"/>
  <text x="130" y="465" font-family="monospace" font-size="13" fill="rgba(239,235,227,0.6)">NEW · LOUNGE CHAIR 01</text>
  <text x="130" y="320" font-family="monospace" font-size="24" font-weight="bold" fill="#efebe3">MAKE ROOM<br/>FOR BETTER</text>

  <!-- product cards -->
  <g>
    <rect x="625" y="265" width="230" height="165" rx="14" fill="#efebe3" stroke="rgba(10,10,10,0.15)"/>
    <!-- lamp -->
    <g stroke="#0a0a0a" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M740 350 v50"/>
      <path d="M740 400 h-22 M740 400 h22"/>
      <path d="M712 350 h56 l-10 -26 h-36 z" fill="rgba(169,188,74,0.4)"/>
    </g>
    <text x="645" y="410" font-family="monospace" font-size="12" fill="#5c5749">PIERCE LAMP</text>
    <text x="645" y="290" font-family="monospace" font-size="13" font-weight="bold" fill="#0a0a0a">₹2,499</text>

    <rect x="875" y="265" width="230" height="165" rx="14" fill="#efebe3" stroke="rgba(10,10,10,0.15)"/>
    <!-- table -->
    <g stroke="#0a0a0a" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M935 355 h210 M950 355 v55 M1130 355 v55"/>
      <rect x="975" y="330" width="60" height="25" rx="4" fill="rgba(169,188,74,0.4)"/>
    </g>
    <text x="895" y="410" font-family="monospace" font-size="12" fill="#5c5749">OAK TABLE</text>
    <text x="895" y="290" font-family="monospace" font-size="13" font-weight="bold" fill="#0a0a0a">₹8,999</text>
  </g>

  <!-- checkout bar -->
  <rect x="625" y="450" width="480" height="45" rx="12" fill="#a9bc4a"/>
  <text x="665" y="478" font-family="monospace" font-size="14" font-weight="bold" fill="#0a0a0a">CHECKOUT — 2 ITEMS · ₹11,498 →</text>

  <!-- category chips -->
  <g font-family="monospace" font-size="12">
    <rect x="100" y="530" width="110" height="30" rx="15" fill="none" stroke="rgba(10,10,10,0.3)"/>
    <text x="120" y="550" fill="#0a0a0a">CHAIRS</text>
    <rect x="225" y="530" width="110" height="30" rx="15" fill="none" stroke="rgba(10,10,10,0.3)"/>
    <text x="245" y="550" fill="#0a0a0a">LAMPS</text>
    <rect x="350" y="530" width="110" height="30" rx="15" fill="#7a8b2d"/>
    <text x="370" y="550" fill="#efebe3">TABLES</text>
    <rect x="475" y="530" width="120" height="30" rx="15" fill="none" stroke="rgba(10,10,10,0.3)"/>
    <text x="495" y="550" fill="#0a0a0a">SHELVES</text>
  </g>
  <!-- responsive icons -->
  <g stroke="#918b7a" stroke-width="2" fill="none">
    <rect x="960" y="535" width="26" height="20" rx="3"/>
    <rect x="1000" y="530" width="34" height="26" rx="4"/>
    <rect x="1046" y="522" width="44" height="36" rx="5" stroke="#0a0a0a"/>
  </g>

  <g font-family="monospace" font-size="12" letter-spacing="2">
    <rect x="60" y="622" width="90" height="30" rx="15" fill="none" stroke="rgba(10,10,10,0.3)"/>
    <text x="78" y="642" fill="#0a0a0a">HTML</text>
    <rect x="165" y="622" width="80" height="30" rx="15" fill="none" stroke="rgba(10,10,10,0.3)"/>
    <text x="183" y="642" fill="#0a0a0a">CSS</text>
    <rect x="260" y="622" width="130" height="30" rx="15" fill="#7a8b2d"/>
    <text x="278" y="642" fill="#efebe3">JAVASCRIPT</text>
  </g>
</svg>
