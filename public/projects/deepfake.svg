  <g fill="#0a0a0a">
    <rect x="860" y="290" width="10" height="40" rx="3"/>
    <rect x="880" y="260" width="10" height="70" rx="3"/>
    <rect x="900" y="300" width="10" height="50" rx="3" fill="#7a8b2d"/>
    <rect x="920" y="240" width="10" height="90" rx="3" fill="#7a8b2d"/>
    <rect x="940" y="285" width="10" height="60" rx="3"/>
    <rect x="960" y="225" width="10" height="105" rx="3" fill="#7a8b2d"/>
    <rect x="980" y="270" width="10" height="75" rx="3"/>
    <rect x="1000" y="250" width="10" height="95" rx="3" fill="#7a8b2d"/>
    <rect x="1020" y="295" width="10" height="55" rx="3"/>
    <rect x="1040" y="235" width="10" height="100" rx="3"/>
    <rect x="1060" y="280" width="10" height="65" rx="3" fill="#7a8b2d"/>
    <rect x="1080" y="255" width="10" height="90" rx="3"/>
    <rect x="1100" y="295" width="10" height="55" rx="3" fill="#7a8b2d"/>
