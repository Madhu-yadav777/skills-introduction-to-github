  <!-- fusion bar -->
  <rect x="470" y="420" width="670" height="150" rx="18" fill="#111110"/>
  <text x="500" y="458" font-family="monospace" font-size="12" letter-spacing="3" fill="rgba(239,235,227,0.55)">CONTRASTIVE TRIPLET LOSS · FUSION</text>
  <rect x="500" y="480" width="560" height="14" rx="7" fill="rgba(239,235,227,0.15)"/>
  <rect x="500" y="480" width="522" height="14" rx="7" fill="#a9bc4a"/>
  <rect x="1022" y="480" width="38" height="14" rx="7" fill="#e05a4e"/>
  <text x="500" y="535" font-family="monospace" font-size="26" font-weight="bold" fill="#efebe3">MANIPULATION SCORE</text>
  <text x="1060" y="535" font-family="monospace" font-size="26" font-weight="bold" fill="#a9bc4a">93.2%</text>
  <text x="500" y="558" font-family="monospace" font-size="11" fill="rgba(239,235,227,0.4)">DATASETS: FACEFORENSICS++ · FAKEAVCELEB</text>

